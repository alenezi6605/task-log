name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/task-log || (git clone https://github.com/alenezi6605/task-log.git /home/ubuntu/task-log && cd /home/ubuntu/task-log)
            cd /home/ubuntu/task-log
            git fetch origin main
            git reset --hard origin/main
            docker build -t task-log .
            docker stop task-log 2>/dev/null || true
            docker rm task-log 2>/dev/null || true
            docker volume create task-log-data 2>/dev/null || true
            docker run -d \
              --name task-log \
              --restart unless-stopped \
              -p 3001:3001 \
              -v task-log-data:/data \
              task-log
            echo "Deployment complete"
