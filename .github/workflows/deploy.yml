name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/task-log || (git clone https://github.com/alenezi6605/task-log.git /home/ubuntu/task-log && cd /home/ubuntu/task-log)
            cd /home/ubuntu/task-log
            git fetch origin main
            git reset --hard origin/main
            docker build -t task-log .
            docker stop task-log 2>/dev/null || true
            docker rm task-log 2>/dev/null || true
            docker volume create task-log-data 2>/dev/null || true
            docker run -d \
              --name task-log \
              --restart unless-stopped \
              -p 3001:3001 \
              -v task-log-data:/data \
              task-log
            echo "Deployment complete"

      - name: Post-deploy smoke tests (via SSH on EC2)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sleep 15
            BASE="http://localhost:3001"
            PASS=0
            FAIL=0

            check() {
              local name="$1" url="$2" expected="$3"
              local status
              status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url")
              if [ "$status" = "$expected" ]; then
                echo "PASS [$status] $name"
                PASS=$((PASS + 1))
              else
                echo "FAIL [$status] $name (expected $expected, got $status)"
                FAIL=$((FAIL + 1))
              fi
            }

            check_body() {
              local name="$1" url="$2" pattern="$3"
              local body
              body=$(curl -s --max-time 10 "$url")
              if echo "$body" | grep -q "$pattern"; then
                echo "PASS [body] $name"
                PASS=$((PASS + 1))
              else
                echo "FAIL [body] $name (pattern '$pattern' not found)"
                FAIL=$((FAIL + 1))
              fi
            }

            check "App homepage" "$BASE/" 200
            check "Health endpoint" "$BASE/health" 200
            check "API config" "$BASE/api/config" 200
            check "API tasks" "$BASE/api/tasks" 200
            check "API agents" "$BASE/api/agents" 200
            check "API rooms" "$BASE/api/rooms" 200
            check "API eng-tasks" "$BASE/api/eng-tasks" 200
            check "Static app.js" "$BASE/app.js" 200
            check "Static style.css" "$BASE/style.css" 200

            # SSE check — connect with 3s timeout, accept 200 or timeout (curl exit 28)
            SSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 3 "$BASE/api/events"; true)
            if [ "$SSE_CODE" = "200" ]; then
              echo "PASS [sse] SSE endpoint reachable"
              PASS=$((PASS + 1))
            else
              echo "FAIL [sse] SSE endpoint (got $SSE_CODE)"
              FAIL=$((FAIL + 1))
            fi

            check_body "Agents has id field" "$BASE/api/agents" '"id"'
            check_body "Config has token field" "$BASE/api/config" '"token"'
            check_body "Health returns ok status" "$BASE/health" '"status"'
            check_body "Homepage has OPS CORE" "$BASE/" "OPS CORE"
            check "Unknown API route is 404" "$BASE/api/doesnotexist" 404

            echo ""
            echo "Smoke tests: $PASS passed, $FAIL failed"
            if [ "$FAIL" -gt 0 ]; then
              echo "SMOKE TEST FAILURE"
              exit 1
            fi
            echo "All smoke tests passed"
